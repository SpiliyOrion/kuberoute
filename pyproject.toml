[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kuberoute-gateway"
version = "0.1.0"
description = "KubeRoute: adaptive AI inference gateway (foundation)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pre-commit>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["gateway/src/kuberoute_gateway"]

[tool.pytest.ini_options]
testpaths = ["gateway/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
