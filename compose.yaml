services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - KUBEROUTE_REMOTE_BASE_URL
      - KUBEROUTE_REMOTE_MODEL_ID
      - KUBEROUTE_REMOTE_API_KEY
      - KUBEROUTE_REMOTE_DEADLINE_SECONDS
      - KUBEROUTE_REMOTE_MODELS_JSON
