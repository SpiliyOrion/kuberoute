apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberoute-gateway
  labels:
    app: kuberoute-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuberoute-gateway
  template:
    metadata:
      labels:
        app: kuberoute-gateway
    spec:
      containers:
        - name: gateway
          image: kuberoute-gateway:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: kuberoute-gateway
  labels:
    app: kuberoute-gateway
spec:
  type: ClusterIP
  selector:
    app: kuberoute-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
